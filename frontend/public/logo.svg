    <circle cx="8" cy="-20" r="3" fill="#16a34a"/>
    <circle cx="-4" cy="-12" r="3" fill="#16a34a"/>
    <circle cx="4" cy="-12" r="3" fill="#16a34a"/>
    <rect x="-5" y="0" width="10" height="22" rx="5" fill="white"/>
  </g>

  <!-- 공 -->
  <circle cx="60" cy="36" r="10" fill="white"/>
  <path d="M52 34 Q60 30 68 34" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  <path d="M52 38 Q60 42 68 38" fill="none" stroke="#16a34a" stroke-width="1.5"/>
