    <circle cx="-8" cy="-28" r="3" fill="#16a34a"/>
    <circle cx="0" cy="-28" r="3" fill="#16a34a"/>
    <circle cx="8" cy="-28" r="3" fill="#16a34a"/>
    <circle cx="-8" cy="-20" r="3" fill="#16a34a"/>
