<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- 녹색 원형 배경 -->
  <circle cx="60" cy="60" r="58" fill="#16a34a"/>

  <!-- 왼쪽 패들 -->
  <g transform="translate(60,58) rotate(-35)">
    <ellipse cx="0" cy="-22" rx="18" ry="22" fill="white"/>
    <!-- 구멍들 -->
    <circle cx="-8" cy="-28" r="3" fill="#16a34a"/>
    <circle cx="0" cy="-28" r="3" fill="#16a34a"/>
    <circle cx="8" cy="-28" r="3" fill="#16a34a"/>
    <circle cx="-8" cy="-20" r="3" fill="#16a34a"/>
    <circle cx="0" cy="-20" r="3" fill="#16a34a"/>
    <circle cx="8" cy="-20" r="3" fill="#16a34a"/>
    <circle cx="-4" cy="-12" r="3" fill="#16a34a"/>
    <circle cx="4" cy="-12" r="3" fill="#16a34a"/>
    <!-- 손잡이 -->
    <rect x="-5" y="0" width="10" height="22" rx="5" fill="white"/>
